name: NPlay - testar receptor TV
on:
  push:
    paths:
      - 'novaplay/pc-tv/**'
      - 'novaplay/tests/media-engine.test.mjs'
      - 'novaplay/tests/xtream-playback.test.mjs'
      - '.github/workflows/nplay-tv-receiver-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verificar sintaxe do receptor
        run: |
          node --check novaplay/pc-tv/media-engine.mjs
          node --check novaplay/pc-tv/xtream-client.mjs
          node --check novaplay/pc-tv/bridge.mjs
      - name: Testar receptor Xtream e fallback
        run: node --test novaplay/tests/media-engine.test.mjs novaplay/tests/xtream-playback.test.mjs
