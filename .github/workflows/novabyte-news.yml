name: NovaByte Atualiza

on:
  push:
    paths:
      - ".github/novabyte-news-trigger.txt"
  schedule:
    # Horários de Lucas do Rio Verde / Cuiabá (UTC-4):
    # 08:30, 12:30 e 19:30
    - cron: "30 12 * * *"
    - cron: "30 16 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novabyte-atualiza
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar e publicar uma notícia
        run: node scripts/news/run-news.mjs

      - name: Publicar alterações no repositório
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nenhuma notícia nova para publicar."
            exit 0
          fi
          git config user.name "NovaByte Atualiza Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html noticias-tecnologia.html sitemap.xml scripts/news/history.json assets/news/ '*.html'
          git commit -m "NovaByte Atualiza: publicação automática"
          git push
