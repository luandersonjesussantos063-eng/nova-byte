name: Importar dez capas aprovadas na NovaPlay
on:
  push:
    paths:
      - .github/workflows/import-novaplay-posters-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar as dez capas aprovadas
