jkmD-RtriaItyWueCgKQ-I3xmA8VzsVdfeDUSFBuU9eg&x-canva-quality=thumbnail"},{"slug":"belle_e_sebastian_a_aventura_continua","url":"https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F7d53a54f-a079-4d47-829b-ecbcc0eb447b/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAANM_OV8WjQcZ3hZ8bmiDd4b38fN20E8MRJHxfs2SY7w0&exp=1791859141&osig=AAAAAAAAAAAAAAAAAAAAALFhDBSIEu7BZ8UIsem8vopAeJktKRbFgz5kBvieUc2G&signer=media-rpc&token=AAIAAU0AJDdkNTNhNTRmLWEwNzktNGQ0Ny04MjliLWVjYmNjMGViNDQ3YgAAAAABoTMgqYgS0uhXBU71p1POhcPRN6BlhVhtT-NKauHxIihmbRK-Ng&x-canva-quality=thumbnail"},{"slug":"black_clover_dublado","url":"https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2Fc27e1293-1fc7-410c-a515-36c57ecca4e2/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAKG-XFz_YU7SRS8MLbhYNo7kLFaTS79y7yY4pnAG-uEq&exp=1791861451&osig=AAAAAAAAAAAAAAAAAAAAAGC--7WpL0OZASFwoyInKpoXPb0eRth5UCsGKE3bTRTB&signer=media-rpc&token=AAIAAU0AJGMyN2UxMjkzLTFmYzctNDEwYy1hNTE1LTM2YzU3ZWNjYTRlMgAAAAABoTND6PiGWzU3JFsxMUQ11ns8VlWmBgILjHt0-k1eaI4k_SHK7Q&x-canva-quality=thumbnail"},{"slug":"castlevania_dublado","url":"https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F031871b2-7284-4084-a4d6-a21039230aff/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAG903s1rFQ_B7nnHC1SgRu3au9-5xp_OAUwvelkHr6Vi&exp=1791859100&osig=AAAAAAAAAAAAAAAAAAAAAEI8ErW7Ff8JTdA-jGr9XT06KG2t89bQtNoB_oIOrSu6&signer=media-rpc&token=AAIAAU0AJDAzMTg3MWIyLTcyODQtNDA4NC1hNGQ2LWEyMTAzOTIzMGFmZgAAAAABoTMgCWD7P9yguW51Chr3GVnrpd3RMeVkZt2k62rvlL9NGZuJnA&x-canva-quality=thumbnail"},{"slug":"date_a_live_iv","url":"https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2Ff50065af-1911-4a66-bac2-75c66aaa7dd5/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAADA0lBJlFhmOEi7Ul4qGKfc6WEe0us1Rn4hwPGl1rVpY&exp=1791860068&osig=AAAAAAAAAAAAAAAAAAAAAHp5xhyLnIWcBdcAqBrmYGhiXAEB5kw5OSZl1qfpEey_&signer=media-rpc&token=AAIAAU0AJGY1MDA2NWFmLTE5MTEtNGE2Ni1iYWMyLTc1YzY2YWFhN2RkNQAAAAABoTMuzqBCN8_eYhGmWaMBAHkAkqThjaNiNLHmKezX6JmVmL-fEA&x-canva-quality=thumbnail"},{"slug":"great_pretender_razbliuto_filme","url":"https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F90b22f89-ef1e-41b2-99d6-324e937eb1e2/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAISRMO4PIz7VXwG8Jc1lmlxvOzRiJjsAUxhiEwUrNJMv&exp=1791860625&osig=AAAAAAAAAAAAAAAAAAAAAOgFA_oBCUIiu8hrgjyZlBw_05djwX47EOoAi9czQa1_&signer=media-rpc&token=AAIAAU0AJDkwYjIyZjg5LWVmMWUtNDFiMi05OWQ2LTMyNGU5MzdlYjFlMgAAAAABoTM3TmhYDkjs-gerB1MyAYPKuCQK9B_nuFe1z295yLjwYQf_ng&x-canva-quality=thumbnail"},{"slug":"jibaku_shounen_hanako_kun_dublado","url":"https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F05ac2e75-8477-46b3-aadb-4d7ca2cf5272/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAJUkIKUJ-COpwA7P__WQEgYqGy3qiGQF5SojLt0aDNlB&exp=1791861123&osig=AAAAAAAAAAAAAAAAAAAAAKFZUzIYd27sIBrTR-dbSEzY3CV2ezM_wITWkBHuTLPC&signer=media-rpc&token=AAIAAU0AJDA1YWMyZTc1LTg0NzctNDZiMy1hYWRiLTRkN2NhMmNmNTI3MgAAAAABoTM-57hiAuN5n_LZM4c8D_srTZzjzBJEctPG3V5QQNAOYDX6-Q&x-canva-quality=thumbnail"}]'
        run: |
          python3 -m pip install --quiet pillow --break-system-packages
          python3 - <<'PY'
          import os, json, urllib.request, io, struct, pathlib
          posters=json.loads(os.environ["NOVAPLAY_COVERS_JSON"])
          output=pathlib.Path("novaplay/assets/approved-covers-v2")
          output.mkdir(parents=True,exist_ok=True)
          def check_dim(data):
              if not data.startswith(b"\xff\xd8\xff"): raise ValueError("Not JPEG")
              # Pillow preinstalled on ubuntu? fallback no dimension check
              try:
                  from PIL import Image
                  x=Image.open(io.BytesIO(data)); x.verify()
                  x=Image.open(io.BytesIO(data))
                  return x.size
              except ImportError: return (0,0)
          for i,p in enumerate(posters):
              original=p["url"]
              variants=[("hd",original.replace("/height:200/quality:75/","/height:1024/quality:90/")),("original",original)]
              received=False
              for mode,url in variants:
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 NovaPlay-Cover-Importer"})
                      with urllib.request.urlopen(req,timeout=35) as rsp:
                          binary=rsp.read()
                      width,height=check_dim(binary)
                      if len(binary)<1500: raise ValueError("Too small image")
                      target=output/(p["slug"]+".jpg")
                      target.write_bytes(binary)
                      print("COVER_UPLOADED",p["slug"],mode,len(binary),"dimension",width,height,flush=True)
                      received=True
                      break
                  except Exception as exc:
                      print("COVER_SOURCE_RETRY",p["slug"],mode,str(exc)[:180],flush=True)
              if not received: raise RuntimeError("Failed to download "+p["slug"])
          print("COVER_IMPORT_COMPLETE",len(posters),flush=True)
          PY
      - name: Gravar as capas no site
        shell: bash
        run: |
          git config user.name 'NovaPlay Content Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add novaplay/assets/approved-covers-v2
          if git diff --cached --quiet; then echo 'Todas as capas já estavam salvas'; exit 0; fi
          git commit -m 'assets(novaplay): guardar as 10 capas aprovadas pelo usuário'
          git push
