name: NovaByte Robo - APK experimental Android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK 35
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK debug experimental
        working-directory: divulga/robot-android
        run: gradle :app:assembleDebug --no-daemon
      - name: Guardar APK experimental (nao publicar na Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: novabyte-robo-android-debug-apk
          path: divulga/robot-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
