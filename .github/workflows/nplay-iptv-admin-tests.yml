name: NPlay - verificar IPTV ADM
on:
  push:
    paths:
      - 'novaplay/admin/iptv-accounts.js'
      - 'novaplay/tests/iptv-delete-account.test.mjs'
      - 'novaplay/worker/iptv-api.mjs'
      - 'novaplay/admin/index.html'
      - 'novaplay/tests/iptv-health-admin.test.mjs'
      - 'novaplay/tests/iptv-account-diagnostic.test.mjs'
      - 'novaplay/tests/iptv-api.test.mjs'
      - 'novaplay/tests/iptv-backend-concurrency.test.mjs'
      - 'novaplay/iptv/migrations/read_catalog_without_account_row_lock_20261018.sql'
      - '.github/workflows/nplay-iptv-admin-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe
        run: |
          node --check novaplay/admin/iptv-accounts.js
          node --check novaplay/worker/iptv-api.mjs
      - name: Testar gateway e integração do painel
        run: node --test novaplay/tests/iptv-delete-account.test.mjs novaplay/tests/iptv-health-admin.test.mjs novaplay/tests/iptv-api.test.mjs novaplay/tests/iptv-account-diagnostic.test.mjs novaplay/tests/iptv-backend-concurrency.test.mjs
