name: Importar cartazes dos destaques atuais
on:
  push:
    paths:
      - .github/workflows/import-featured-covers-v023.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar processamento de imagens
        run: python3 -m pip install --quiet pillow --break-system-packages
      - name: Preparar capas verificadas e capa especial
        shell: bash
        env:
          COVERS_JSON: '[{"slug":"a_era_do_gelo","url":"https://image.tmdb.org/t/p/w780/A2NR4rJdD6bIVE61T7rhHxrrGvv.jpg"},{"slug":"a_era_do_gelo_4","url":"https://image.tmdb.org/t/p/w780/dWiHLqARtyAAOy0nLvXIxRYkfNA.jpg"},{"slug":"a_familia_do_futuro","url":"https://image.tmdb.org/t/p/w780/uR9rV69x4saB2vh9yfgQ5PA5E0r.jpg"},{"slug":"a_fantastica_fabrica_de_chocolate","url":"https://image.tmdb.org/t/p/w780/kV7OSqIbzIyUPRrNkqhoYThhzlF.jpg"}]'
        run: |
          python3 - <<'PY'
          import json, os, io, urllib.request, time, math, pathlib
          from PIL import Image,ImageOps,ImageFilter,ImageDraw,ImageFont
          srcs=json.loads(os.environ["COVERS_JSON"])
          dest=pathlib.Path("novaplay/assets/featured-covers")
          dest.mkdir(parents=True,exist_ok=True)
          def download(url):
              r=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; NovaPlayCoverVerifier/1.0)","Accept":"image/avif,image/webp,image/jpeg,image/png,image/*"})
              with urllib.request.urlopen(r, timeout=30) as resp:
                  data=resp.read()
              img=Image.open(io.BytesIO(data))
              img.load()
              return img.convert("RGB"),len(data)
          for entry in srcs:
              img,bytes_read=download(entry["url"])
              print("SOURCE_OK",entry["slug"],img.size,bytes_read,flush=True)
              if img.width<350 or img.height<490:
                  raise ValueError("Imagem de baixa resolução: "+entry["slug"])
              # Preserve original poster proportions, avoiding cropping off the localized title.
              if img.height/img.width < 1.3 or img.height/img.width > 1.8:
                  backdrop=ImageOps.fit(img,(900,1350)).filter(ImageFilter.GaussianBlur(18))
                  fitted=ImageOps.contain(img,(900,1350))
                  backdrop.paste(fitted,((900-fitted.width)//2,(1350-fitted.height)//2))
                  img=backdrop
              else:
                  img=img.resize((900,1350),Image.Resampling.LANCZOS)
              img.save(dest/(entry["slug"]+".jpg"),quality=90,optimize=True,progressive=True)
              print("FEATURED_POSTER_OK",entry["slug"],img.size,flush=True)
          # The special/episode is not the 2007 feature film. Use the actual source video's thumbnail
          # inside an original branded composition, not an unrelated film poster.
          frame=None
          for suffix in ("maxresdefault.jpg","hqdefault.jpg"):
              try:
                  temp,_=download("https://i.ytimg.com/vi/Zj0vqEbnaz4/"+suffix)
                  if temp.width<320 or temp.height<180:continue
                  frame=temp
                  print("GRANDE_FAMILIA_SOURCE",suffix,temp.size,flush=True)
                  break
              except Exception as exc:
                  print("GRANDE_FAMILIA_FRAME_RETRY",str(exc)[:140],flush=True)
          if frame is None: raise ValueError("Miniatura do vídeo não acessível; não usar capa genérica errada")
          w,h=900,1350
          canvas=Image.new("RGB",(w,h))
          pix=canvas.load()
          for y in range(h):
              for x in range(w):
                  glow=math.exp(-((x-720)**2/(2*350**2)+(y-370)**2/(2*420**2)))
                  pix[x,y]=(int(12+40*glow),int(20+42*glow),int(45+28*glow))
          img=ImageOps.fit(frame,(850,700),method=Image.Resampling.LANCZOS,centering=(0.5,0.42))
          img=img.filter(ImageFilter.UnsharpMask(radius=2,percent=130,threshold=3))
          canvas.paste(img,(25,180))
          overlay=Image.new("RGBA",(w,h),(0,0,0,0))
          d=ImageDraw.Draw(overlay)
          # Fade lower edge of still with overlay, plus a luminous amber accent.
          for yy in range(710,1050):
              a=int(230*(yy-710)/340)
              d.rectangle((0,yy,w,yy+1),fill=(5,12,30,min(230,a)))
          d.rounded_rectangle((56,75,390,126),12,fill=(255,179,58,235))
          for offset in range(3):
              d.line((55,1023+offset,845,1023+offset),fill=(251,176,71,180),width=2)
          canvas=Image.alpha_composite(canvas.convert("RGBA"),overlay)
          d=ImageDraw.Draw(canvas)
          def font(sz):
              from pathlib import Path
              for p in ("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf","/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"):
                  if Path(p).exists():return ImageFont.truetype(p,sz)
              return ImageFont.load_default()
          def center(txt,y,fnt,fill):
              bx=d.textbbox((0,0),txt,font=fnt,stroke_width=2)
              dx=(w-(bx[2]-bx[0]))//2
              d.text((dx,y),txt,font=fnt,fill=fill,stroke_width=2,stroke_fill=(5,12,26,255))
          d.text((75,85),"ESPECIAL DE COMÉDIA",font=font(21),fill=(19,27,42,255))
          center("A GRANDE",920,font(83),(255,255,247,255))
          center("FAMÍLIA",1003,font(112),(255,211,101,255))
          center("O ROUBO",1145,font(69),(255,250,245,255))
          center("NOVA PLAY • DESTAQUES",1270,font(21),(163,184,215,255))
          canvas.convert("RGB").save(dest/"a_grande_familia_o_roubo.jpg",quality=91,optimize=True,progressive=True)
          print("FEATURED_POSTER_OK","a_grande_familia_o_roubo",canvas.size,flush=True)
          assert len(list(dest.glob("*.jpg")))==5
          print("ALL_FEATURED_COVERS_READY",5,flush=True)
          
          PY
      - name: Publicar cinco arquivos de capa
        shell: bash
        run: |
          git config user.name 'NovaPlay Content Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add novaplay/assets/featured-covers
          if git diff --cached --quiet; then echo 'Capas já instaladas'; exit 0; fi
          git commit -m 'assets(novaplay): cinco capas personalizadas dos filmes em destaque'
          git push
