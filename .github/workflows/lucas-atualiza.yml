name: Lucas Atualiza

on:
  push:
    paths:
      - ".github/lucas-news-trigger.txt"
  schedule:
    # Horários de Lucas do Rio Verde / Cuiabá (UTC-4): 08:45, 12:45 e 18:45
    - cron: "45 12 * * *"
    - cron: "45 16 * * *"
    - cron: "45 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lucas-atualiza
  cancel-in-progress: false

jobs:
  publish-local-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Buscar e publicar notícia de Lucas do Rio Verde
        run: node scripts/local-news/run-local-news.mjs

      - name: Publicar alterações
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nenhuma notícia local nova para publicar."
            exit 0
          fi
          git config user.name "Lucas Atualiza Bot"
          git config user.email "actions@users.noreply.github.com"
          git add noticias-lucas-do-rio-verde.html sitemap.xml scripts/local-news/history.json 'lucas-*.html'
          git commit -m "Lucas Atualiza: publicação automática"
          git pull --rebase origin main
          git push
