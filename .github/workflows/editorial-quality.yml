name: Qualidade editorial e publicação
on:
  push:
    paths:
      - 'scripts/editorial-policy.*'
      - 'scripts/tests/editorial-review.test.mjs'
      - 'scripts/news/run-news.mjs'
      - 'scripts/local-news/run-local-news.mjs'
      - 'docs/adsense-review-2026-10-21.json'
      - '.github/workflows/editorial-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/tests/editorial-review.test.mjs
