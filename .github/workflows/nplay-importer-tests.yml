name: NPlay - verificar importador
on:
  push:
    paths:
      - 'novaplay/importer/**'
      - '.github/workflows/nplay-importer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias somente para testes
        run: python -m pip install --disable-pip-version-check httpx botocore
      - name: Instalar FFmpeg para os testes de vídeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Validar sintaxe
        run: python -m compileall -q novaplay/importer
      - name: Executar testes de limpeza, capacidade e streaming
        run: python -m unittest discover -v -s novaplay/importer -p 'test_*.py'
