name: Importar nove capas de animes aprovadas
on:
  push:
    paths:
      - .github/workflows/import-approved-anime-covers.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Transferir capas aprovadas
        shell: bash
