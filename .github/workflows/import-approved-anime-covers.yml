5GFQ5g&x-canva-quality=thumbnail"},{"slug":"hanako","url":"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F7a2e297b-9e52-4ddf-a44d-f0981b7584af/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAJJpGOIHo4cA_1w0csUFMvwaizvoe4bIo84z0Jf7lRVk&exp=1791856946&osig=AAAAAAAAAAAAAAAAAAAAAP8FWPEN5qAbgHO7ASOwKZqei-6mZDNxj33cRWQrUtxQ&signer=media-rpc&token=AAIAAU0AJDdhMmUyOTdiLTllNTItNGRkZi1hNDRkLWYwOTgxYjc1ODRhZgAAAAABoTL_K1CptdImwvwoa01AynuAUwWZ0GUhk9Bl_cHULLhe9Mxqag&x-canva-quality=thumbnail"}]'
        run: |
          python3 - <<'PY'
          import urllib.request, json, os, struct, time
          from pathlib import Path
          posters=json.loads(os.environ['POSTERS_JSON'])
          folder=Path('novaplay/assets/review-covers')
          folder.mkdir(parents=True,exist_ok=True)
          for item in posters:
              slug=item['slug']
              url=item['url']
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 NovaPlay-Poster-Importer'})
              with urllib.request.urlopen(req,timeout=40) as resp: data=resp.read()
              if not data.startswith(b'\x89PNG\r\n\x1a\n'): raise ValueError('PNG inválido para '+slug)
              if len(data)<1000: raise ValueError('Arquivo vazio para '+slug)
              filename=folder/(slug+'.png')
              filename.write_bytes(data)
              print('POSTER_OK',slug,len(data),flush=True)
          PY
      - name: Publicar arquivos na NovaPlay
        shell: bash
        run: |
          git config user.name 'NovaPlay Content Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add novaplay/assets/review-covers
          if git diff --cached --quiet; then echo 'Nenhum arquivo novo'; exit 0; fi
          git commit -m 'assets(novaplay): adicionar capas aprovadas do lote 1 de animes'
          git push
