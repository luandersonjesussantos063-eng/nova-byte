name: Kaia isolated payment QA
on:
  push:
    branches: ['test/kaia-mercadopago-homologacao']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: kaia_mp_qa
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KAIA_TEST_LOCAL_POSTGRES: 'true'
      KAIA_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/kaia_mp_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install 'psycopg[binary]==3.2.13'
      - name: Prepare disposable PostgreSQL and run rollback assertions
        run: |
          psql "$KAIA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
          psql "$KAIA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/kaia-mp-test/001_isolated_test_database.sql
          psql "$KAIA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/kaia-mp-test/002_synthetic_test_fixtures.sql
          psql "$KAIA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/kaia-mp-test/003_assertions_rollback.sql
      - run: python scripts/test-kaia-mp-concurrency.py
      - run: node --test scripts/tests/kaia-homologacao.test.mjs
