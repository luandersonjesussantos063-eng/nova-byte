name: NPlay - validar nova interface
on:
  push:
    paths:
      - 'novaplay/assets/live-epg.js'
      - 'novaplay/assets/live-epg.css'
      - 'novaplay/worker/epg.mjs'
      - 'novaplay/tests/epg.test.mjs'
      - 'novaplay/index.html'
      - 'novaplay/app.js'
      - 'novaplay/assets/live-auth.js'
      - 'novaplay/assets/tv-spotlight.js'
      - 'novaplay/admin/tv-previews.js'
      - 'novaplay/tests/tv-previews-admin.test.mjs'
      - 'novaplay/assets/tv-spotlight.css'
      - 'novaplay/tests/tv-spotlight.test.mjs'
      - 'novaplay/live-embeds.js'
      - 'novaplay/tests/favorites.test.mjs'
      - 'novaplay/assets/cinema-refresh.css'
      - 'novaplay/assets/soft-opening.js'
      - 'novaplay/assets/intro-audio.js'
      - 'novaplay/assets/nplay-opening-original-final.m4a'
      - 'novaplay/assets/release-notes.js'
      - 'novaplay/assets/notifications.js'
      - 'novaplay/tests/release-notes.test.mjs'
      - 'novaplay/tests/youtube-layout.test.mjs'
      - 'novaplay/tests/opening-logo.test.mjs'
      - 'novaplay/profiles.js'
      - 'novaplay/tests/intro-audio.test.mjs'
      - 'novaplay/sw.js'
      - 'novaplay/tests/home-live.test.mjs'
      - 'novaplay/tests/hero-live.test.mjs'
      - '.github/workflows/nplay-interface-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe dos arquivos alterados
        run: |
          node --check novaplay/assets/tv-spotlight.js
          node --check novaplay/app.js
          node --check novaplay/live-embeds.js
          node --check novaplay/assets/soft-opening.js
          node --check novaplay/assets/intro-audio.js
          node --check novaplay/assets/release-notes.js
          node --check novaplay/assets/notifications.js
          node --check novaplay/profiles.js
          node --check novaplay/sw.js
      - name: Conferir integração da intro e da home
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const index=fs.readFileSync('novaplay/index.html','utf8');
          const app=fs.readFileSync('novaplay/app.js','utf8');
          const css=fs.readFileSync('novaplay/assets/cinema-refresh.css','utf8');
          const sw=fs.readFileSync('novaplay/sw.js','utf8');
          for(const phrase of ['id="nplay-soft-opening"','assets/cinema-refresh.css?v=0.51.17','assets/soft-opening.js?v=0.51.17','assets/release-notes.js?v=0.51.17','NPlay V 0.51.17'])assert(index.includes(phrase),phrase);
          assert(sw.includes('novaplay-v0.51.17-tvspotlight'));
          assert(sw.includes('./assets/cinema-refresh.css'));
          assert(sw.includes('./assets/intro-audio.js'));
          assert(sw.includes('./assets/release-notes.js'));
          assert(sw.includes('./assets/notifications.js'));
          assert(index.includes('assets/intro-audio.js?v=0.51.6'));
          assert(index.includes('class="nplay-opening-logo"'),"Abertura sem logo horizontal");
          assert(index.includes('nplay-opening-letter-y'),"Letras da logo não estão animadas");
          assert(index.includes('nplay-opening-reflection'),"Reflexo azul não foi restaurado");
          assert(!index.includes('class="nplay-opening-symbol"'),"Logo antigo duplicado ainda existe");
          assert(!index.includes('class="nplay-opening-name"'),"Texto da logo antiga ainda existe");
          assert(fs.readFileSync('novaplay/assets/brand/nplay-wordmark-v0482.svg','utf8').includes('<svg'),"Logo vetorial inválida");
          assert(css.includes('.nplay-opening-logo'),"CSS da nova abertura está ausente");
          assert(sw.includes('./assets/nplay-opening-original-final.m4a'));
          assert(fs.statSync('novaplay/assets/nplay-opening-original-final.m4a').size>1000);
          const version=index.match(/<meta name="nplay-version" content="([^"]+)"/)?.[1];
          const notes=fs.readFileSync('novaplay/assets/release-notes.js','utf8');
          assert(version&&notes.includes('version:"'+version+'"'),'Toda versão publicada precisa ter novidades detalhadas');
          assert(app.includes('Filmes disponíveis'));
          assert(app.includes('Séries para acompanhar'));
          assert(css.includes('prefers-reduced-motion'));
          assert(!app.includes('openTimeshift'));
          console.log('NPlay interface 0.51.17 — integração validada');
          JS
      - name: Testes de catalogo ao vivo na home
        run: node --test novaplay/tests/tv-previews-admin.test.mjs novaplay/tests/tv-spotlight.test.mjs novaplay/tests/favorites.test.mjs novaplay/tests/epg.test.mjs novaplay/tests/home-live.test.mjs novaplay/tests/soft-opening.test.mjs novaplay/tests/intro-audio.test.mjs novaplay/tests/release-notes.test.mjs novaplay/tests/youtube-layout.test.mjs novaplay/tests/opening-logo.test.mjs
