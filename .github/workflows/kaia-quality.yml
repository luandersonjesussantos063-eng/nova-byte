name: Verificar navegação e transparência Kaia Glow
on:
  push:
    paths:
      - 'kaia-glow/**'
      - 'scripts/tests/kaia-navigation.test.mjs'
      - 'scripts/tests/kaia-admin-management.test.mjs'
      - 'functions/api/kaia/admin-orders.js'
      - '.github/workflows/kaia-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/tests/kaia-navigation.test.mjs scripts/tests/kaia-admin-management.test.mjs

