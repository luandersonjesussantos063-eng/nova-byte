name: NPlay - verificar o que estao assistindo
on:
  push:
    paths:
      - 'novaplay/app.js'
      - 'novaplay/presence.js'
      - 'novaplay/watching.js'
      - 'novaplay/admin/presence-admin.js'
      - 'novaplay/admin/index.html'
      - 'novaplay/assets/notifications.js'
      - 'novaplay/tests/now-watching.test.mjs'
      - 'novaplay/tests/presence-admin.test.mjs'
      - 'novaplay/tests/presence.test.mjs'
      - '.github/workflows/nplay-watching-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watching:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe dos arquivos ativos
        run: |
          node --check novaplay/app.js
          node --check novaplay/presence.js
          node --check novaplay/watching.js
          node --check novaplay/admin/presence-admin.js
          node --check novaplay/assets/notifications.js
      - name: Testar autorizacao, reprodução, player externo e perfis
        run: node --test novaplay/tests/now-watching.test.mjs novaplay/tests/presence-admin.test.mjs novaplay/tests/presence.test.mjs
